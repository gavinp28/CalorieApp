<!doctype html>
<html lang="en" data-brand="tomato">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff5e8" />
    <meta name="description" content="A daily calorie-guessing game. One food, five guesses, how close can you get?" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Daily calorie puzzle</title>
    <script>
      // Set theme before first paint to avoid a light flash in dark mode.
      try {
        var p = JSON.parse(localStorage.getItem('cd1:theme') || '"system"');
        var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        var b = new URLSearchParams(location.search).get('brand') || localStorage.getItem('cd1:brand');
        if (b) document.documentElement.dataset.brand = b;
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
